name: dokanalyse

services:
  front-end:
    container_name: dokanalyse-front-end
    build:
      context: ./client/front-end
    environment:
      - FILE_SHARE_ENABLED=true
    volumes:
      - ${DOKANALYSE_LOCAL_FILE_SHARE_DIR}:/mnt/files:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal      
    restart: always
    depends_on:
      - web-api

  web-api:
    container_name: dokanalyse-web-api
    build:
      context: ./client/api
    environment:
      - PYGEOAPI_API_URL=http://172.17.0.1:5000
      - NAP_USERNAME=${NAP_USERNAME}
      - NAP_PASSWORD=${NAP_PASSWORD}
      - HEALTHCHECK_ENABLED=true
      - HEALTHCHECK_CONFIG_REF=main
      - HEALTHCHECK_DB_PATH=/data/healthcheck/healthcheck.db
      - DB_URL=${DB_URL:-}
    volumes:
      - healthcheck:/data/healthcheck
    ports:
      - "5001:5001"      
    expose:
      - "5001"
    networks:
      - internal      
    restart: always

  mcp-server:
    container_name: dokanalyse-mcp-server
    build:
      context: ./client/mcp
    environment:
      - DOK_API_BASE_URL=http://web-api:5001/api
      - MCP_ENDPOINT=/mcp
      - ASPNETCORE_URLS=http://+:5003
    ports:
      - "5003:5003"
    expose:
      - "5003"
    networks:
      - internal
    depends_on:
      - web-api
    restart: always

volumes:
  dokanalyse:
  healthcheck:

networks:
  internal:
    driver: bridge
